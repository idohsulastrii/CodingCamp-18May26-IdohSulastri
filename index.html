<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <button id="theme-toggle" aria-label="Toggle dark mode">🌙 Dark</button>

  <div class="container">

    <!-- Greeting & Clock -->
    <div class="hero">
      <h1 id="clock">00:00:00</h1>
      <p id="date-display" class="date-display"></p>
      <p id="greeting" class="greeting"></p>
      <div class="name-row">
        <input type="text" id="name-input" placeholder="Enter your name…" autocomplete="off" />
        <button id="save-name-btn">Save</button>
      </div>
    </div>

    <!-- Focus Timer -->
    <section class="card" aria-label="Focus Timer">
      <h2 class="card-title">⏱ Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <div class="timer-controls">
        <input type="number" id="timer-input" placeholder="min" min="1" max="99" />
        <button id="set-timer-btn">Set</button>
      </div>
      <div class="timer-controls">
        <button id="start-btn">▶ Start</button>
        <button id="stop-btn">⏸ Pause</button>
        <button id="reset-btn">↺ Reset</button>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card" aria-label="To-Do List">
      <h2 class="card-title">✅ To-Do</h2>
      <p class="card-hint">Tip: include any emoji in your task text 🎯🔥📚</p>
      <div class="row-input">
        <input type="text" id="todo-input" placeholder="e.g. 📚 Read chapter 3" autocomplete="off" />
        <button id="add-btn">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links -->
    <section class="card" aria-label="Quick Links">
      <h2 class="card-title">🔗 Quick Links</h2>
      <div id="links-grid" class="links-grid"></div>
      <div class="row-input link-input-row">
        <input type="text" id="link-name" placeholder="Label (e.g. 🎬 YouTube)" autocomplete="off" />
        <input type="text" id="link-url"  placeholder="URL" autocomplete="off" />
        <button id="add-link-btn">Add</button>
      </div>
    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
