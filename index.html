<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Idoh</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="theme-toggle" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">🌙 Dark Mode</button>

    <div class="container">
        <h1 id="clock">00:00:00</h1>
        <h2 id="greeting">Halo! Siapa namamu?</h2>
        
        <div style="margin-bottom: 20px;">
            <input type="text" id="name-input" placeholder="Masukkan nama..." style="margin-bottom: 5px;">
            <button id="save-name-btn">Save Nama</button>
        </div>
        
        <div class="timer-card">
            <div id="timer-display" style="font-size: 2.5rem; font-weight: 600; margin-bottom: 10px;">25:00</div>
            <input type="number" id="timer-input" placeholder="Menit" style="width: 80px; margin-bottom: 10px; text-align: center;">
            <button id="set-timer-btn">Set Durasi</button>
            <br>
            <button id="start-btn">Start</button>
            <button id="stop-btn">Stop</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div class="todo-card">
            <input type="text" id="todo-input" placeholder="Tulis tugas...">
            <button id="add-btn">Tambah</button>
            <ul id="todo-list"></ul>
        </div>

        <div class="links-card">
            <h3>🔗 Quick Links</h3>
            <div id="links-container" style="margin: 15px 0;"></div>
            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                <input type="text" id="link-name" placeholder="Nama Web" style="width: 40%;">
                <input type="text" id="link-url" placeholder="URL" style="width: 40%;">
                <button id="add-link-btn">Add</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
